[server]
# 本地开发端口；线上 Streamlit Cloud 由平台接管
port = 8501
# 文件上传限制：单文件 20MB（Streamlit 默认 200MB，此处收紧以匹配产品边界）
maxUploadSize = 20

[browser]

[client]
# 使用产品内置工作流导航，隐藏 Streamlit 自动生成的重复页面导航
showSidebarNavigation = false
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"
